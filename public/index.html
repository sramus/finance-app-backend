<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Tracker</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script></head><body><section id="auth" class="auth panel"><h1>Finance Tracker</h1><p id="authMessage">Sign in to manage your finances.</p><form id="authForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" required><button class="primary">Sign in</button></form><button id="toggleAuth" class="link">Create an account</button></section><div id="app" class="hidden"><header><h1>Finance Tracker</h1><span id="userEmail"></span><button id="logout">Log out</button></header><main><div class="toolbar"><input id="month" type="month"><input id="search" placeholder="Search transactions"><button id="csv">Export CSV</button></div><section class="stats"><div class="card"><small>Income</small><b id="income">$0</b></div><div class="card"><small>Expenses</small><b id="expense">$0</b></div><div class="card"><small>Balance</small><b id="balance">$0</b></div></section><section class="grid"><form id="transactionForm" class="panel"><h2>Add transaction</h2><input type="hidden" id="editId"><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><select id="category"></select><input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input id="date" type="date" required><input id="description" placeholder="Description" required><button class="primary">Save transaction</button></form><form id="recurringForm" class="panel"><h2>Recurring transaction</h2><select id="rType"><option value="expense">Expense</option><option value="income">Income</option></select><select id="rCategory"></select><input id="rAmount" type="number" step="0.01" min="0.01" placeholder="Amount" required><input id="rDate" type="date" required><input id="rDescription" placeholder="Description" required><select id="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select><button class="primary">Add recurring</button></form></section><section class="grid"><div class="panel"><h2>Spending by category</h2><canvas id="categoryChart"></canvas></div><div class="panel"><h2>12-month trend</h2><canvas id="trendChart"></canvas></div></section><section class="panel"><h2>Transactions</h2><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></section><section class="panel"><h2>Recurring rules</h2><div id="recurring"></div></section></main></div><script src="/app.js"></script></body></html>
